name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same branch replaces a run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No install step: the project has no dependencies.
      - run: npm test
